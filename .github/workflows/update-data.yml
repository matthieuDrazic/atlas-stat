name: Actualiser les données publiques
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 1 * *'
permissions:
  contents: write
concurrency:
  group: atlas-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Récupérer et convertir les données (aucune écriture avant validation)
        run: python3 scripts/refresh_public_data.py
      - name: Valider le dépôt
        run: python3 scripts/validate.py
      - name: Enregistrer un instantané valide
        run: |
          git add data/production data/source-status.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh validated public database snapshots'
            git push
          fi
