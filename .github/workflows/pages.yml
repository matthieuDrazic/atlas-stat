name: Publier Atlas sur GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Actualiser les données publiques']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester les modules
        run: node --test tests/core.test.mjs tests/guided.test.mjs
      - name: Valider les fichiers
        run: |
          python3 scripts/validate.py
          python3 tests/update_safety_test.py
      - name: Vérifier le mode de publication choisi
        id: pagesmode
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mode=$(gh api "repos/$GH_REPO/pages" --jq '.build_type' 2>/dev/null || echo disabled)
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode Pages : $mode"
      - uses: actions/configure-pages@v5
        if: steps.pagesmode.outputs.mode == 'workflow' 
      - name: Préparer uniquement les fichiers publics
        if: steps.pagesmode.outputs.mode == 'workflow'
        run: |
          mkdir -p _site
          cp index.html manifest.json service-worker.js LICENSE .nojekyll _site/
          cp -r assets adapters data geo docs _site/
      - uses: actions/upload-pages-artifact@v3
        if: steps.pagesmode.outputs.mode == 'workflow'
        with:
          path: _site
      - name: Déployer
        if: steps.pagesmode.outputs.mode == 'workflow'
        id: deployment
        uses: actions/deploy-pages@v4
